<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ERP Suplementos IA</title>
  <link rel="stylesheet" href="adminkit.css">
  <link rel="stylesheet" href="demo.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="wrapper">
    <aside class="sidebar demo-sidebar">
      <a class="sidebar-brand" href="#painel">Suplementos IA</a>
      <nav class="sidebar-nav" aria-label="Módulos">
        <a href="#painel">Painel</a>
        <a href="#produtos">Produtos</a>
        <a href="#clientes">Clientes</a>
        <a href="#fornecedores">Fornecedores</a>
        <a href="#vendedores">Vendedores</a>
        <a href="#pedidos">Pedidos</a>
      </nav>
    </aside>
    <div class="main">
      <header class="navbar navbar-light">
        <div>
          <strong class="d-block">Modo demonstração</strong>
          <span>Dados fictícios. As alterações ficam neste navegador.</span>
        </div>
        <button type="button" id="reset" class="btn btn-outline-dark">Restaurar dados de exemplo</button>
      </header>
      <main class="content">
        <p id="feedback" class="feedback" role="status"></p>
        <section id="screen" aria-labelledby="page-title"></section>
        <noscript>Ative o JavaScript para usar a demonstração.</noscript>
      </main>
    </div>
  </div>
  <dialog id="editor" aria-labelledby="editor-title">
    <form id="record-form">
      <h2 id="editor-title"></h2>
      <div id="fields"></div>
      <p id="form-error" role="alert" class="text-danger"></p>
      <div class="actions">
        <button type="button" id="cancel" class="btn btn-outline-secondary">Cancelar</button>
        <button type="submit" class="btn btn-primary">Salvar</button>
      </div>
    </form>
  </dialog>
</body>
</html>
